services:
  db:
    image: postgres:15
    container_name: pg-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: syntax_db
    ports:
      - "5432:5432"            # localhost:5432 -> Postgres im Container
    volumes:
      - pgdata:/var/lib/postgresql/data   # Daten überleben down/up

volumes:
  pgdata: