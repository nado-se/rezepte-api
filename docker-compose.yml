services:
  db:
    image: postgres:15
    container_name: pg-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"            # localhost:5432 -> Postgres im Container
    volumes:
      - pgdata:/var/lib/postgresql/data   # Daten überleben down/up

volumes:
  pgdata: